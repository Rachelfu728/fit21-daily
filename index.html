<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日健康紀錄</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b7a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日健康紀錄">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --leaf:#5b7a5b;        /* 深葉綠 */
    --leaf-soft:#e8efe6;   /* 淺葉底 */
    --clay:#c98a5e;        /* 陶土,提醒/強調 */
    --ink:#33382f;         /* 墨綠黑,文字 */
    --ink-soft:#767c6e;    /* 次要文字 */
    --paper:#f6f4ee;       /* 紙底 */
    --card:#ffffff;
    --line:#e0ddd2;
    --ok:#5b7a5b;
    --warn:#c98a5e;
    --radius:18px;
    --shadow:0 2px 14px rgba(70,80,60,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    font-size:16px;
  }
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}

  /* ---------- 通用 ---------- */
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea,select{font-family:inherit;font-size:16px;}
  .hidden{display:none!important;}

  .btn-main{
    width:100%;padding:16px;border-radius:var(--radius);
    background:var(--leaf);color:#fff;font-size:17px;font-weight:600;
    box-shadow:var(--shadow);
  }
  .btn-main:active{transform:scale(.99);}
  .btn-ghost{
    width:100%;padding:14px;border-radius:var(--radius);
    background:transparent;color:var(--leaf);font-size:16px;
    border:1.5px solid var(--leaf);
  }
  .btn-sub{
    padding:11px 18px;border-radius:14px;background:var(--leaf-soft);
    color:var(--leaf);font-weight:600;font-size:15px;
  }

  /* ---------- 登入頁 ---------- */
  #login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100vh;text-align:center;}
  .brand{margin-bottom:38px;}
  .brand .leaf-mark{font-size:44px;}
  .brand h1{font-size:23px;margin:14px 0 4px;letter-spacing:1px;}
  .brand p{color:var(--ink-soft);margin:0;font-size:15px;}
  #login input{
    width:100%;padding:16px;border-radius:var(--radius);border:1.5px solid var(--line);
    background:var(--card);margin-bottom:14px;text-align:center;
  }
  #login input:focus{outline:none;border-color:var(--leaf);}
  .login-hint{color:var(--ink-soft);font-size:13px;margin-top:22px;}

  /* ---------- 填寫頁 頂部 ---------- */
  header.top{
    padding:20px 22px 14px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:var(--paper);z-index:5;
  }
  header.top .hello{font-size:15px;color:var(--ink-soft);}
  header.top .hello b{color:var(--ink);font-size:17px;font-weight:600;}
  header.top .date{font-size:13px;color:var(--ink-soft);}
  .logout{font-size:13px;color:var(--ink-soft);background:none;text-decoration:underline;}

  /* 進度條 */
  .progress{padding:0 22px 8px;}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar span{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s;}
  .step-label{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-soft);}

  /* 快速動作列 */
  .quick-bar{display:flex;gap:10px;padding:0 18px 4px;}
  .quick-btn{
    flex:1;padding:12px 8px;border-radius:14px;font-size:14px;font-weight:600;
    border:1.5px solid var(--line);background:var(--card);
  }
  .quick-btn.ask{border-color:var(--clay);color:var(--clay);background:#fbf3ec;}
  .quick-btn.hist{color:var(--leaf);}
  .quick-btn:active{transform:scale(.99);}

  /* 過去紀錄 */
  .hist-card{background:var(--card);margin:12px 18px;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);}
  .hist-card .h-date{font-size:15px;font-weight:600;margin-bottom:8px;}
  .hist-card .h-stats{font-size:13.5px;color:var(--ink-soft);}
  .hist-card .h-stats b{color:var(--ink);font-weight:600;}
  .hist-sec-title{padding:18px 20px 2px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .hist-ask{background:#fbf3ec;border:1px solid var(--clay);margin:8px 18px;border-radius:14px;padding:12px 14px;font-size:14px;}
  .hist-ask .ha-time{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .hist-ask .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .hist-ask .thumbs img{width:54px;height:54px;object-fit:cover;border-radius:10px;}

  /* 比對提醒 */
  .compare-note{background:#fbf3ec;border:1.5px solid var(--clay);border-radius:14px;padding:14px 16px;margin-bottom:4px;}
  .compare-note .cn-line{font-weight:600;color:var(--clay);font-size:14.5px;margin-bottom:6px;}
  .compare-note .cn-tip{font-size:14px;color:var(--ink);line-height:1.6;}

  /* 給學員的圖文卡 */
  .card-preview-wrap{padding:0 18px;display:flex;justify-content:center;}
  .msg-card{
    width:100%;max-width:440px;
    background:
      radial-gradient(circle at 18% 12%, rgba(201,138,94,.10), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(91,122,91,.12), transparent 45%),
      linear-gradient(155deg,#faf7f1 0%,#eef2ea 55%,#e6ede3 100%);
    border-radius:26px;
    padding:0;position:relative;overflow:hidden;
    box-shadow:0 8px 30px rgba(90,100,70,.14);
  }
  /* 外框內描邊 */
  .msg-card .mc-inner{
    margin:14px;border:1px solid rgba(91,122,91,.28);border-radius:18px;
    padding:36px 30px 28px;text-align:center;position:relative;
  }
  /* 奶昔+茶 插圖 */
  .msg-card .mc-illus{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:12px;}
  .msg-card .mc-to{
    font-size:15px;color:var(--leaf);font-weight:600;margin-bottom:6px;letter-spacing:2px;
  }
  .msg-card .mc-to span{color:var(--ink);font-size:19px;}
  .msg-card .mc-divider{
    width:44px;height:1.5px;background:var(--clay);opacity:.55;margin:14px auto 20px;border-radius:2px;
  }
  .msg-card .mc-body{
    font-size:18px;line-height:2.05;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;min-height:56px;
    padding:6px 6px 0;
  }
  .msg-card .mc-sign{
    margin-top:24px;padding-top:16px;border-top:1px dashed rgba(118,124,110,.35);
    font-size:14px;color:var(--ink-soft);
  }
  .msg-card .mc-sign b{color:var(--leaf);font-weight:600;}
  .msg-card .mc-brand{font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:4px;}
  .msg-card .mc-date{position:absolute;top:16px;right:18px;font-size:11px;color:var(--ink-soft);opacity:.8;}

  /* 卡片 */
  .card{
    background:var(--card);margin:14px 18px;border-radius:var(--radius);
    padding:22px 20px;box-shadow:var(--shadow);
  }
  .card h2{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .card .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}

  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:15px;font-weight:600;margin-bottom:8px;}
  .field .unit{color:var(--ink-soft);font-weight:400;font-size:13px;}
  .num-input{
    width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--paper);
  }
  .num-input:focus{outline:none;border-color:var(--leaf);background:#fff;}

  /* 照片上傳格 */
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .photo-slot{
    width:78px;height:78px;border-radius:14px;border:1.5px dashed var(--line);
    background:var(--paper);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:24px;position:relative;overflow:hidden;
  }
  .photo-slot img{width:100%;height:100%;object-fit:cover;}
  .photo-slot .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;
    width:20px;height:20px;border-radius:50%;font-size:13px;line-height:20px;text-align:center;}
  .photo-slot input{position:absolute;inset:0;opacity:0;}
  .meal-block{margin-bottom:16px;}
  .meal-block > span{font-size:14px;font-weight:600;display:block;margin-bottom:8px;}

  /* 計步器 +/- */
  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;width:fit-content;}
  .stepper button{width:48px;height:48px;background:var(--leaf-soft);color:var(--leaf);font-size:22px;font-weight:600;}
  .stepper .val{width:56px;text-align:center;font-size:18px;font-weight:600;}

  /* 是/否 切換 */
  .toggle-group{display:flex;gap:10px;}
  .toggle-group button{
    flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:15px;font-weight:600;
  }
  .toggle-group button.on-yes{background:var(--leaf);color:#fff;border-color:var(--leaf);}
  .toggle-group button.on-no{background:#efe7df;color:var(--clay);border-color:var(--clay);}

  /* 水量快選 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chips button{
    padding:11px 15px;border-radius:99px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:14px;font-weight:600;
  }
  .chips button.on{background:var(--leaf);color:#fff;border-color:var(--leaf);}

  /* 心情 */
  .moods{display:flex;justify-content:space-between;gap:6px;}
  .moods button{
    flex:1;padding:12px 4px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--paper);font-size:26px;
  }
  .moods button .m-txt{display:block;font-size:11px;margin-top:4px;color:var(--ink-soft);}
  .moods button.on{border-color:var(--leaf);background:var(--leaf-soft);}

  textarea{
    width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--paper);min-height:90px;resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--leaf);background:#fff;}

  .nav-btns{display:flex;gap:12px;padding:8px 18px 34px;}
  .nav-btns .btn-ghost{flex:0 0 34%;}
  .nav-btns .btn-main{flex:1;}

  /* 提醒教練那格 醒目 */
  .ask-coach{border:1.5px solid var(--clay);background:#fbf3ec;}
  .ask-coach h2 .tag{font-size:12px;background:var(--clay);color:#fff;padding:2px 9px;border-radius:99px;font-weight:600;}

  /* 完成頁 */
  #done{padding:60px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100vh;}
  #done .big{font-size:56px;}
  #done h2{font-size:23px;margin:16px 0 6px;}
  #done p{color:var(--ink-soft);margin:0 0 30px;}

  /* ---------- 後台 ---------- */
  #admin{padding-bottom:40px;}
  .admin-head{padding:22px 20px 6px;}
  .admin-head h1{font-size:21px;margin:0 0 4px;}
  .admin-head p{color:var(--ink-soft);font-size:13.5px;margin:0;}
  .admin-tools{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap;}
  .admin-tools input{flex:1;min-width:140px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;}
  .client-card{
    background:var(--card);margin:10px 18px;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);
  }
  .client-card .cc-head{display:flex;justify-content:space-between;align-items:center;}
  .client-card .cc-name{font-size:17px;font-weight:600;}
  .client-card .cc-date{font-size:12px;color:var(--ink-soft);}
  .client-card .flag{background:var(--clay);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px;}
  .cc-stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
  .cc-stats .s{font-size:13px;color:var(--ink-soft);}
  .cc-stats .s b{display:block;font-size:17px;color:var(--ink);font-weight:600;}
  .cc-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;display:none;}
  .cc-detail.open{display:block;}
  .cc-detail .row{margin-bottom:10px;}
  .cc-detail .row .k{color:var(--ink-soft);font-size:12.5px;}
  .cc-detail .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .cc-detail .thumbs img{width:60px;height:60px;object-fit:cover;border-radius:10px;}
  .cc-detail .coach-q{background:#fbf3ec;border-radius:12px;padding:10px 12px;margin-top:6px;border:1px solid var(--clay);}
  .expand{font-size:13px;color:var(--leaf);background:none;margin-top:12px;text-decoration:underline;}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:14px;}

  .mode-switch{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12px;padding:8px 16px;border-radius:99px;opacity:.85;z-index:50;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== 登入 ===================== -->
  <section id="login">
    <div class="brand">
      <div class="leaf-mark">🌿</div>
      <h1>每日健康紀錄</h1>
      <p>今天也好好照顧自己</p>
    </div>
    <input id="loginName" placeholder="輸入你的姓名" autocomplete="off">
    <button class="btn-main" onclick="doLogin()">開始今天的紀錄</button>
    <p class="login-hint">教練請輸入「後台」進入管理頁</p>
  </section>

  <!-- ===================== 填寫 ===================== -->
  <section id="form" class="hidden">
    <header class="top">
      <div class="hello">你好,<b id="who">—</b></div>
      <div style="text-align:right">
        <div class="date" id="today">—</div>
        <button class="logout" onclick="logout()">登出</button>
      </div>
    </header>
    <div class="quick-bar">
      <button class="quick-btn ask" onclick="openAsk()">🙋 臨時問教練這餐</button>
      <button class="quick-btn hist" onclick="openHistory()">📅 看過去紀錄</button>
    </div>
    <div class="progress">
      <div class="bar"><span id="barFill"></span></div>
      <div class="step-label"><span id="stepName">今日數據</span><span id="stepNum">1 / 7</span></div>
    </div>

    <div id="steps"></div>

    <div class="nav-btns">
      <button class="btn-ghost" id="prevBtn" onclick="prevStep()">上一步</button>
      <button class="btn-main" id="nextBtn" onclick="nextStep()">下一步</button>
    </div>
  </section>

  <!-- ===================== 完成 ===================== -->
  <section id="done" class="hidden">
    <div class="big">🌱</div>
    <h2>今天完成了!</h2>
    <p>紀錄已送給教練,明天見。</p>
    <button class="btn-ghost" onclick="logout()" style="max-width:260px;margin:0 auto;">回首頁</button>
  </section>

  <!-- ===================== 臨時問教練 ===================== -->
  <section id="ask" class="hidden">
    <header class="top">
      <div class="hello">臨時問教練</div>
      <button class="logout" onclick="backToForm()">返回</button>
    </header>
    <div class="card ask-coach">
      <h2>🙋 這餐可以吃嗎?</h2>
      <p class="sub">隨時拍、隨時問。這裡送出的每一則教練都會單獨看到,不影響你今天的完整紀錄</p>
      <div class="field"><label>餐點照片</label><div id="askPhotos"></div></div>
      <div class="field"><label>想問的話</label>
        <textarea id="askText" placeholder="例:這個便當可以吃嗎?份量會不會太多?"></textarea></div>
    </div>
    <div class="nav-btns">
      <button class="btn-ghost" onclick="backToForm()" style="flex:0 0 34%">返回</button>
      <button class="btn-main" onclick="submitAsk()">送給教練</button>
    </div>
  </section>

  <!-- ===================== 問教練 完成 ===================== -->
  <section id="askdone" class="hidden">
    <div class="big">📩</div>
    <h2>已經送給教練了!</h2>
    <p>教練看到會盡快回覆你。</p>
    <div style="max-width:280px;margin:0 auto;display:flex;flex-direction:column;gap:12px">
      <button class="btn-ghost" onclick="openAsk()">再問一餐</button>
      <button class="btn-main" onclick="backToForm()">回到今日紀錄</button>
    </div>
  </section>

  <!-- ===================== 過去紀錄 ===================== -->
  <section id="history" class="hidden">
    <header class="top">
      <div class="hello">過去紀錄</div>
      <button class="logout" onclick="backToForm()">返回</button>
    </header>
    <div id="historyList"></div>
  </section>

  <!-- ===================== 後台 ===================== -->
  <section id="admin" class="hidden">
    <div class="admin-head">
      <h1>教練後台</h1>
      <p>今天的客戶紀錄總覽</p>
    </div>
    <div class="admin-tools">
      <input id="search" placeholder="搜尋客戶姓名" oninput="renderAdmin()">
      <button class="btn-sub" onclick="openCompose()">✍️ 寫給學員的話</button>
      <button class="btn-sub" onclick="changePw()">修改密碼</button>
      <button class="btn-sub" onclick="logout()">離開</button>
    </div>
    <div id="clientList"></div>
  </section>

  <!-- ===================== 寫給學員 圖文卡 ===================== -->
  <section id="compose" class="hidden">
    <header class="top">
      <div class="hello">寫給學員的話</div>
      <button class="logout" onclick="backToAdmin()">返回後台</button>
    </header>
    <div class="card">
      <div class="field"><label>學員名字</label>
        <input class="num-input" id="c_name" list="nameList" placeholder="輸入或選擇學員" oninput="renderCard()">
        <datalist id="nameList"></datalist></div>
      <div class="field"><label>想說的話</label>
        <textarea id="c_msg" placeholder="寫下你想對她說的鼓勵、提醒或肯定…" oninput="renderCard()" style="min-height:120px"></textarea></div>
    </div>

    <div class="card-preview-wrap">
      <div id="cardCanvas" class="msg-card">
        <div class="mc-inner">
          <div class="mc-date" id="mc-date"></div>
          <div class="mc-illus">
            <svg viewBox="0 0 60 80" width="46" height="61" xmlns="http://www.w3.org/2000/svg" aria-label="奶昔">
              <!-- 奶昔杯 -->
              <path d="M14 26 L46 26 L42 74 Q41 78 37 78 L23 78 Q19 78 18 74 Z" fill="#f3ece2" stroke="#c98a5e" stroke-width="2"/>
              <!-- 奶昔內容 -->
              <path d="M16 34 L44 34 L41 70 Q40.5 74 37 74 L23 74 Q19.5 74 19 70 Z" fill="#e7d3bf"/>
              <!-- 上方奶油 -->
              <ellipse cx="30" cy="26" rx="16" ry="5" fill="#fbf6ef" stroke="#c98a5e" stroke-width="2"/>
              <path d="M22 24 Q26 14 30 22 Q34 12 38 24" fill="none" stroke="#c98a5e" stroke-width="2" stroke-linecap="round"/>
              <!-- 櫻桃 -->
              <circle cx="30" cy="14" r="4" fill="#b0654e"/>
              <path d="M30 10 Q33 5 36 6" fill="none" stroke="#5b7a5b" stroke-width="1.6" stroke-linecap="round"/>
              <!-- 吸管 -->
              <line x1="38" y1="8" x2="44" y2="34" stroke="#5b7a5b" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <svg viewBox="0 0 70 70" width="52" height="52" xmlns="http://www.w3.org/2000/svg" aria-label="茶">
              <!-- 熱氣 -->
              <path d="M28 12 Q24 8 28 4" fill="none" stroke="#a9b6a0" stroke-width="2" stroke-linecap="round"/>
              <path d="M36 12 Q32 8 36 4" fill="none" stroke="#a9b6a0" stroke-width="2" stroke-linecap="round"/>
              <!-- 杯身 -->
              <path d="M14 22 L52 22 L48 52 Q46 60 38 60 L28 60 Q20 60 18 52 Z" fill="#f3ece2" stroke="#5b7a5b" stroke-width="2"/>
              <!-- 茶水 -->
              <ellipse cx="33" cy="24" rx="17" ry="4" fill="#cdb892"/>
              <!-- 把手 -->
              <path d="M52 28 Q64 30 60 42 Q58 48 50 46" fill="none" stroke="#5b7a5b" stroke-width="2.2" stroke-linecap="round"/>
              <!-- 底盤 -->
              <ellipse cx="33" cy="63" rx="22" ry="4" fill="#e7ddcb" stroke="#5b7a5b" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="mc-to">給　<span id="mc-name">—</span></div>
          <div class="mc-divider"></div>
          <div class="mc-body" id="mc-body">在這裡預覽你想說的話…</div>

/* =========================================================
   資料儲存層 —— 改用 Firebase Realtime Database(即時、多客戶)
   照片壓縮後直接存進資料庫,不需綁定信用卡開通 Storage
   ========================================================= */
const DB = {
  async save(entry){
    // 同一人同一天 → 用固定 key 覆蓋
    const key = entry.name + '__' + entry.dateKey;
    await fdb.ref('entries/'+safeKey(key)).set(entry);
  },
  async today(name, dateKey){
    const snap = await fdb.ref('entries/'+safeKey(name+'__'+dateKey)).get();
    return snap.exists() ? snap.val() : null;
  },
  async allToday(dateKey){
    const snap = await fdb.ref('entries').get();
    if(!snap.exists()) return [];
    return Object.values(snap.val()).filter(e=>e.dateKey===dateKey).sort((a,b)=>b.ts-a.ts);
  },
  async history(name){
    const snap = await fdb.ref('entries').get();
    if(!snap.exists()) return [];
    return Object.values(snap.val()).filter(e=>e.name===name).sort((a,b)=>b.ts-a.ts);
  },
  async saveAsk(entry){
    await fdb.ref('asks').push(entry);
  },
  async asksToday(dateKey){
    const snap = await fdb.ref('asks').get();
    if(!snap.exists()) return [];
    return Object.values(snap.val()).filter(e=>e.dateKey===dateKey).sort((a,b)=>b.ts-a.ts);
  },
  async asksHistory(name){
    const snap = await fdb.ref('asks').get();
    if(!snap.exists()) return [];
    return Object.values(snap.val()).filter(e=>e.name===name).sort((a,b)=>b.ts-a.ts);
  }
};
// Firebase key 不能有 . # $ [ ] / ,把姓名等轉成安全字串
function safeKey(s){ return encodeURIComponent(s).replace(/\./g,'%2E'); }

/* 照片壓縮 —— 縮到最長邊 900px、JPEG 品質 0.6,存進資料庫剛好 */
function compressImage(file, maxSize=900, quality=0.6){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height && width>maxSize){ height=height*maxSize/width; width=maxSize; }
        else if(height>maxSize){ width=width*maxSize/height; height=maxSize; }
        const c=document.createElement('canvas'); c.width=width; c.height=height;
        c.getContext('2d').drawImage(img,0,0,width,height);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function setPath(path,val){ if(path.includes('.')){const[a,b]=path.split('.');data[a][b]=val;} else data[path]=val; }

async function addPhoto(path,input){

function rmPhoto(path,i){ getPath(path).splice(i,1); renderStep(); }
function bump(key,d,min){ data[key]=Math.max(min,(data[key]??min)+d); $('#v_'+key).textContent=data[key]; }

function checkCompare(){
  const box=$('#compareBox'); if(!box) return;
  if(!prevRecord){ box.innerHTML=''; return; }
  const items=[
    {key:'f_weight', prev:prevRecord.weight, label:'體重', unit:'公斤'},
    {key:'f_bodyfat', prev:prevRecord.bodyfat, label:'體脂肪', unit:'%'},
    {key:'f_visceral', prev:prevRecord.visceral, label:'內臟脂肪', unit:''}
  ];
  const ups=[];
  items.forEach(it=>{
    const el=$('#'+it.key); if(!el) return;
    const now=parseFloat(el.value); const was=parseFloat(it.prev);
    if(!isNaN(now) && !isNaN(was) && now>was){
      ups.push(`${it.label}比上次多了 ${(now-was).toFixed(1)}${it.unit}`);
    }
  });
  if(ups.length===0){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="compare-note">
    <div class="cn-line">${ups.join('、')}。</div>
    <div class="cn-tip">沒關係,回想一下昨天吃了什麼、水分有沒有喝足夠,明天再調整就好 🌿</div>
  </div>`;
}

    const canvas = await html2canvas(el, {scale:2, backgroundColor:null});
    const link = document.createElement('a');
    link.download = `給${name||'學員'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){ alert('產生圖片失敗,請再試一次'); }
}
function copyCardText(){
  const name = $('#c_name').value.trim();
  const msg = $('#c_msg').value.trim();
  if(!msg){ alert('先寫想說的話'); return; }
  const text = `給 ${name}\n\n${msg}\n\n— Rachel 教練`;
  navigator.clipboard.writeText(text).then(
    ()=>alert('文字已複製,可以貼到 LINE 了'),
    ()=>alert('複製失敗,請手動選取')
  );
}

/* ---------- 後台 ---------- */
async function renderAdmin(){
  const dk = dateKeyOf(new Date());
  const q = ($('#search')?.value||'').trim();
  const box = $('#clientList');
  if(!box.dataset.loaded){ box.innerHTML=`<div class="empty">載入中…</div>`; }
  let list = await DB.allToday(dk);
  let asks = await DB.asksToday(dk);
  box.dataset.loaded='1';
  if(q){ list = list.filter(e=>e.name.includes(q)); asks = asks.filter(e=>e.name.includes(q)); }
  let html='';

  // 臨時問教練 —— 放最上面,提醒優先回覆
  html+=`<div class="hist-sec-title" style="padding-top:6px">🙋 臨時問教練 ${asks.length?`(${asks.length})`:''}</div>`;
  if(asks.length===0){ html+=`<div class="empty" style="padding:20px">目前沒有待回覆的問餐</div>`; }
  else html+=asks.map(a=>{
    const t=new Date(a.ts); const tm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    const ap=Array.isArray(a.photos)?a.photos:[];
    return `<div class="client-card" style="border:1.5px solid var(--clay)">
      <div class="cc-head"><div class="cc-name">${a.name} <span class="flag">要回覆</span></div><div class="cc-date">${tm}</div></div>
      ${a.text?`<div style="margin-top:10px;font-size:14.5px">${a.text}</div>`:''}
      ${ap.length?`<div class="thumbs" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${ap.map(s=>`<img src="${s}" style="width:70px;height:70px;object-fit:cover;border-radius:10px">`).join('')}</div>`:''}
    </div>`;
  }).join('');

  // 每日紀錄
  html+=`<div class="hist-sec-title">📋 今日每日紀錄 ${list.length?`(${list.length})`:''}</div>`;
  if(list.length===0){ html+=`<div class="empty" style="padding:20px">今天還沒有客戶填寫紀錄</div>`; }
  else html+=list.map((e,idx)=>clientCard(e,idx)).join('');

  box.innerHTML = html;
}
function clientCard(e,idx){
  const t=new Date(e.ts); const time=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  const ph=e.photos||{};
  const A=x=>Array.isArray(x)?x:[];
  const hasCoachQ = A(e.coachPhotos).length || e.coachQ;
  const snackFlag = e.snack===true;
  const allPhotos=[...A(ph.breakfast),...A(ph.lunch),...A(ph.dinner),...A(ph.other)];
  return `<div class="client-card">
    <div class="cc-head">
      <div class="cc-name">${e.name}
        ${hasCoachQ?'<span class="flag">要回覆</span>':''}
        ${snackFlag?'<span class="flag" style="background:#a58b5c">有偷吃</span>':''}
      </div>
      <div class="cc-date">${time} 填寫</div>
    </div>
    <div class="cc-stats">
      <div class="s">體重<b>${e.weight||'—'}</b></div>
      <div class="s">體脂<b>${e.bodyfat||'—'}</b></div>
      <div class="s">內臟脂肪<b>${e.visceral||'—'}</b></div>
      <div class="s">奶昔<b>${e.shake||0} 杯</b></div>
      <div class="s">心情<b>${e.mood||'—'}</b></div>
    </div>
    <button class="expand" onclick="this.nextElementSibling.classList.toggle('open')">看完整紀錄 ▾</button>
    <div class="cc-detail">
      ${hasCoachQ?`<div class="coach-q"><div class="k">🙋 想問教練的餐</div>
        ${e.coachQ?`<div>${e.coachQ}</div>`:''}
        ${A(e.coachPhotos).length?`<div class="thumbs">${A(e.coachPhotos).map(s=>`<img src="${s}">`).join('')}</div>`:''}</div>`:''}
      <div class="row"><span class="k">量測數據</span><div>體重 ${e.weight||'—'}・體脂 ${e.bodyfat||'—'}・內臟脂肪 ${e.visceral||'—'}</div>
        ${(()=>{const mp=[...A(e.mPhotos),...A(e.mWeight),...A(e.mBodyfat),...A(e.mVisceral)];return mp.length?`<div class="thumbs">${mp.map(s=>`<img src="${s}">`).join('')}</div>`:'';})()}</div>
      <div class="row"><span class="k">飲食照片</span>
        ${allPhotos.length?`<div class="thumbs">${allPhotos.map(s=>`<img src="${s}">`).join('')}</div>`:'<div>無</div>'}</div>
      <div class="row"><span class="k">計畫</span><div>奶昔 ${e.shake||0} 杯・錠片 ${e.tabletDone===true?'✅ 完成':e.tabletDone===false?'❌ 未完成':'—'}・喝水 ${e.water||'—'} c.c.</div></div>
      <div class="row"><span class="k">排便</span><div>${e.poop===true?'有,'+(e.poopTimes||1)+' 次':e.poop===false?'沒有':'—'}</div></div>
      <div class="row"><span class="k">誠實區</span><div>${e.snack===true?'有:'+(e.snackNote||'(未填)'):e.snack===false?'沒有':'—'}</div></div>
      <div class="row"><span class="k">想說的話</span><div>${e.message||'—'}</div></div>
    </div>
  </div>`;
}

/* ---------- 後台即時更新 ---------- */
// 只要雲端資料有變,而且教練正在看後台,就自動重新整理
function watchAdmin(){
  const refresh=()=>{ if(!$('#admin').classList.contains('hidden')) renderAdmin(); };
  fdb.ref('entries').on('value', refresh);
  fdb.ref('asks').on('value', refresh);
}
watchAdmin();

/* ---------- 啟動 ---------- */
show('login');
</script>
